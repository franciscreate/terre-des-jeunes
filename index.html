<title>Visuel animé</title>
<style>
:root {
  --bg: #ffebd7;
  color-scheme: light;
}

html,
body {
  width: 100%;
  margin: 0;
  padding: 0;
  background: var(--bg);
}

body {
  overflow: hidden;
}

svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}

svg * {
  transform-box: fill-box;
}

.wind {
  transform-origin: 50% 100%;
  animation: sway 4.2s ease-in-out infinite alternate;
}

.wind.arrow {
  animation-name: swayArrow;
}

@keyframes sway {
  from { transform: rotate(-2.6deg); }
  to   { transform: rotate(2.6deg); }
}

@keyframes swayArrow {
  from { transform: rotate(-1.35deg); }
  to   { transform: rotate(1.35deg); }
}

@media (prefers-reduced-motion: reduce) {
  svg * {
    animation: none !important;
  }
}
</style>
</head>
